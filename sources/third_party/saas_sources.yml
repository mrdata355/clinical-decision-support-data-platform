sources:
  billing_platform:
    domain: finance
    transport: https
    cadence: hourly
    classification: internal
    objects:
      subscription:
        key: subscription_id
        updated_at: source_updated_at
      invoice:
        key: invoice_id
        updated_at: source_updated_at
    watermark:
      interval: closed_open
      commit_after_reconciliation: true
  crm:
    domain: business
    transport: https
    cadence: hourly
    classification: internal
    objects:
      organization:
        key: organization_id
        updated_at: source_updated_at
      account_relationship:
        key: relationship_id
        updated_at: source_updated_at
  support_platform:
    domain: operations
    transport: https
    cadence: hourly
    classification: internal
    objects:
      support_case:
        key: case_id
        updated_at: source_updated_at

shared_controls:
  retryable_statuses: [408, 425, 429, 500, 502, 503, 504]
  pagination_cycle_detection: true
  raw_payload_preservation: true
  source_updated_at_required: true
  stable_business_key_required: true
  max_quarantine_ratio: 0.02
  source_to_target_reconciliation: true
  secrets_from_runtime_secret_store_only: true

observability:
  metrics:
    - request_count
    - request_latency_seconds
    - retry_count
    - extracted_rows
    - source_lag_seconds
    - quarantine_ratio
    - reconciliation_difference
