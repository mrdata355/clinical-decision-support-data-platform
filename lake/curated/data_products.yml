version: 2
zone: curated
purpose: governed_business_serving_data_products

path_convention: >-
  s3://clinical-data-{env}-curated/{data_product}/business_date={yyyy-mm-dd}/

publication:
  source_zone: merge
  require_quality_gate: true
  require_reconciliation_gate: true
  require_lineage_registration: true
  publish_atomic_partitions: true
  preserve_previous_successful_partition_until_commit: true
  require_contract_version: true

products:
  product_usage_daily:
    owner: product_analytics
    grain: one_row_per_date_channel_country
    dimensions: [event_date, channel, country_code]
    measures: [sessions_started, searches, tool_views, tool_starts, tool_completions, result_copies, favorites_added, content_views, guideline_views, unique_users, unique_accounts, completion_rate]
    freshness_slo_minutes: 60
    consumers: [product_analytics, operations, executive_reporting]
  tool_engagement_daily:
    owner: product_analytics
    grain: one_row_per_date_tool_channel_country
    dimensions: [event_date, clinical_tool_key, tool_id, tool_name, tool_type, primary_specialty, condition_group, channel, country_code]
    measures: [tool_views, tool_starts, tool_completions, result_copies, result_shares, favorite_adds, favorite_removes, quality_rating_views, unique_users, unique_accounts, sessions, view_to_start_rate, start_to_complete_rate, view_to_complete_rate, rolling_7d_avg_views, rolling_28d_avg_users]
    freshness_slo_minutes: 60
    consumers: [product, analytics, content, clinical_quality]
  search_funnel_daily:
    owner: product_analytics
    grain: one_row_per_date_query_token_channel
    dimensions: [event_date, search_query_token, channel, specialty_context]
    measures: [searches, impressions, clicks, unique_users, downstream_tool_views, downstream_tool_starts, downstream_tool_completions, click_through_rate, search_to_tool_rate, mean_clicked_rank, zero_result_searches]
    freshness_slo_minutes: 60
    consumers: [product, search, ml_platform, content]
  recommendation_performance_daily:
    owner: ml_platform
    grain: one_row_per_date_model_version_channel
    dimensions: [event_date, model_name, model_version, channel]
    measures: [impressions, clicks, tool_starts, tool_completions, click_through_rate, completion_rate, coverage, novelty, fallback_rate]
    freshness_slo_minutes: 60
    consumers: [ml_platform, product]
  specialty_engagement_daily:
    owner: product_analytics
    grain: one_row_per_date_specialty_channel
    dimensions: [event_date, primary_specialty, channel]
    measures: [unique_users, unique_accounts, sessions, tool_views, tool_starts, tool_completions, searches, completion_rate]
    freshness_slo_minutes: 60
    consumers: [product, content, leadership]
  content_engagement_daily:
    owner: product_analytics
    grain: one_row_per_date_content_channel
    dimensions: [event_date, content_key, content_type, specialty, channel]
    measures: [views, unique_users, unique_sessions, views_per_user, downstream_tool_starts]
    freshness_slo_minutes: 120
    consumers: [content, product]
  quality_trust_daily:
    owner: clinical_quality
    grain: one_row_per_date_tool_rating_version
    dimensions: [event_date, clinical_tool_key, rating_version, overall_score, scientific_soundness_score, importance_score, usability_feasibility_score, fairness_equity_status]
    measures: [tool_views, quality_rating_views, starts, completions, unique_users, rating_view_rate, completion_rate]
    freshness_slo_minutes: 120
    consumers: [clinical_quality, product, analytics]
  cme_engagement_daily:
    owner: product_analytics
    grain: one_row_per_date_content_specialty
    dimensions: [event_date, content_key, specialty]
    measures: [eligible_content_views, cme_content_views, credits_earned_events, credit_hours_earned, unique_users, completion_rate]
    freshness_slo_minutes: 120
    consumers: [education, product, finance]
  ehr_integration_daily:
    owner: integrations
    grain: one_row_per_date_organization_integration_tool
    dimensions: [event_date, organization_token, integration_id, tool_id]
    measures: [launches, autofill_events, autofill_fields, confirmed_fields, writebacks, unique_users, autofill_confirmation_rate, launch_to_completion_rate, writeback_rate, p95_integration_latency_ms]
    freshness_slo_minutes: 30
    consumers: [integrations, product, operations]
  pipeline_reliability_daily:
    owner: data_platform
    grain: one_row_per_date_pipeline
    dimensions: [event_date, pipeline_name]
    measures: [run_count, success_count, failed_count, success_rate, p50_duration_seconds, p95_duration_seconds, source_rows, quarantined_rows, quarantine_rate, reconciliation_failures, freshness_breach_count, continuous_query_restart_count]
    freshness_slo_minutes: 30
    consumers: [engineering, operations]
  ml_model_health_daily:
    owner: ml_platform
    grain: one_row_per_date_model_version
    dimensions: [event_date, model_name, model_version]
    measures: [scoring_requests, p95_scoring_latency_ms, prediction_null_rate, feature_null_rate, feature_drift_score, prediction_drift_score, label_delay_hours, offline_metric, online_metric, fallback_rate]
    freshness_slo_minutes: 60
    consumers: [ml_platform, product, operations]

semantic_rules:
  rates: {zero_denominator_result: null, precision: 6}
  unique_users: {source: pseudonymous_user_token, never_reconstruct_identity: true}
  quality_rating:
    overall_max: 10
    scientific_soundness_max: 6
    importance_max: 3
    usability_feasibility_max: 1
  time: {warehouse_timezone: UTC, reporting_date: event_date_utc, local_time_conversion: consumer_layer_only}
  privacy:
    direct_identifiers_allowed: false
    patient_level_serving_products_allowed: false
    free_text_queries_allowed: false

serving:
  snowflake: {database: CLINICAL_ANALYTICS, schema: MART}
  file_exports: {allowed: true, format: parquet, classification_limit: internal}
  api_exports: {allowed: true, require_contract: true, require_access_policy: true}
  sql_copilot:
    allowed_models: [tool_engagement_daily, search_funnel_daily, specialty_engagement_daily, content_engagement_daily, quality_trust_daily, cme_engagement_daily, ehr_integration_daily, pipeline_reliability_daily, ml_model_health_daily]
    select_only: true
    default_limit: 200
    max_limit: 5000
