[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-decision-support-data-platform"
version = "1.0.0"
description = "Data engineering platform for clinical decision-support product analytics and operations"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "sqlalchemy>=2.0,<3",
  "snowflake-connector-python>=3.12,<4",
  "snowflake-sqlalchemy>=1.6,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "python-dateutil>=2.9,<3",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
orchestration = [
  "apache-airflow>=2.10,<3",
  "apache-airflow-providers-snowflake>=6,<7",
  "apache-airflow-providers-http>=5,<6",
]
transformation = [
  "dbt-core>=1.9,<2",
  "dbt-snowflake>=1.9,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-python-dateutil>=2.9,<3",
]

[project.scripts]
clinical-pipeline = "clinical_data_platform.runtime:main"
clinical-demo-data = "clinical_data_platform.demo_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires external services",
  "warehouse: exercises Snowflake-specific behavior",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "airflow/logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["clinical_data_platform"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["airflow/dags/"]

[tool.coverage.run]
source = ["src/clinical_data_platform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
